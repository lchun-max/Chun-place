<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiny Fishing Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 36px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .main-content {
      display: flex;
      gap: 20px;
      padding: 20px;
    }

    .game-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      border: 4px solid #333;
      background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #0047AB 100%);
      border-radius: 10px;
      cursor: pointer;
      max-width: 100%;
      height: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .caught-fish {
      margin-top: 15px;
      min-height: 30px;
      text-align: center;
    }

    .caught-fish p {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      animation: fadeInOut 2s ease-in-out;
    }

    @keyframes fadeInOut {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-20px); }
    }

    .right-panel {
      flex: 1;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
      max-height: 600px;
    }

    .stats-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
    }

    .stat {
      text-align: center;
      padding: 10px;
      background: white;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .stat:nth-child(3) {
      grid-column: 1 / -1;
    }

    .stat label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
    }

    .stat h2 {
      font-size: 24px;
      color: #667eea;
    }

    .cast-button {
      padding: 25px;
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      text-transform: uppercase;
    }

    .cast-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
    }

    .cast-button:active {
      transform: translateY(0);
    }

    .cast-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .upgrades-section {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
    }

    .upgrades-section h3 {
      margin-bottom: 12px;
      color: #333;
      font-size: 16px;
    }

    .upgrade-item {
      background: white;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      transition: all 0.2s;
    }

    .upgrade-item:hover {
      border-color: #667eea;
      box-shadow: 0 3px 10px rgba(102, 126, 234, 0.1);
    }

    .upgrade-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
      font-size: 14px;
    }

    .upgrade-header span:last-child {
      background: #667eea;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

    .upgrade-desc {
      font-size: 12px;
      color: #666;
      margin-bottom: 8px;
    }

    .upgrade-btn {
      width: 100%;
      padding: 10px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      transition: all 0.2s;
    }

    .upgrade-btn:hover {
      background: #5568d3;
    }

    .upgrade-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .fish-collection {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      border: 2px solid #e0e0e0;
      flex-grow: 1;
    }

    .fish-collection h3 {
      margin-bottom: 12px;
      color: #333;
      font-size: 16px;
    }

    .collection-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
    }

    .fish-item {
      background: white;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .fish-name {
      font-weight: bold;
      color: #333;
    }

    .fish-value {
      background: #f0f0f0;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
    }

    .fish-rarity {
      font-size: 11px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 3px;
      margin-left: 5px;
    }

    .rarity-common {
      background: #d4d4d4;
      color: #333;
    }

    .rarity-uncommon {
      background: #4a9eff;
      color: white;
    }

    .rarity-rare {
      background: #9d4edd;
      color: white;
    }

    .rarity-epic {
      background: #ff6b9d;
      color: white;
    }

    .rarity-legendary {
      background: #ffd60a;
      color: #333;
    }

    .right-panel::-webkit-scrollbar,
    .collection-list::-webkit-scrollbar {
      width: 6px;
    }

    .right-panel::-webkit-scrollbar-track,
    .collection-list::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }

    .right-panel::-webkit-scrollbar-thumb,
    .collection-list::-webkit-scrollbar-thumb {
      background: #667eea;
      border-radius: 10px;
    }

    .right-panel::-webkit-scrollbar-thumb:hover,
    .collection-list::-webkit-scrollbar-thumb:hover {
      background: #5568d3;
    }

    @media (max-width: 900px) {
      .main-content {
        flex-direction: column;
      }
      
      .right-panel {
        max-height: none;
      }
      
      .stats-box {
        grid-template-columns: 1fr 1fr 1fr;
      }
      
      .stat:nth-child(3) {
        grid-column: auto;
      }
    }

    @media (max-width: 600px) {
      .container {
        border-radius: 0;
      }
      
      .header h1 {
        font-size: 28px;
      }
      
      canvas {
        max-width: 100%;
      }
      
      .stats-box {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎣 Tiny Fishing</h1>
    </div>
    
    <div class="main-content">
      <div class="game-area">
        <canvas id="gameCanvas" width="500" height="600"></canvas>
        <div class="caught-fish">
          <p id="caughtText"></p>
        </div>
      </div>
      
      <div class="right-panel">
        <div class="stats-box">
          <div class="stat">
            <label>💰 Coins</label>
            <h2 id="coinCount">0</h2>
          </div>
          <div class="stat">
            <label>📈 Income/sec</label>
            <h2 id="incomeCount">0</h2>
          </div>
          <div class="stat">
            <label>🐟 Fish Caught</label>
            <h2 id="fishCaughtCount">0</h2>
          </div>
        </div>
        
        <button id="castBtn" class="cast-button">CAST LINE</button>
        
        <div class="upgrades-section">
          <h3>⬆️ UPGRADES</h3>
          
          <div class="upgrade-item">
            <div class="upgrade-header">
              <span>📏 Line Length</span>
              <span id="lineLevelDisplay">Lvl 1</span>
            </div>
            <p id="lineDesc" class="upgrade-desc">Reach deeper waters for better fish</p>
            <button onclick="buyUpgrade('lineLength')" id="lineBtn" class="upgrade-btn">
              Cost: <span id="lineCost">100</span> 💰
            </button>
          </div>
          
          <div class="upgrade-item">
            <div class="upgrade-header">
              <span>🪝 Extra Hooks</span>
              <span id="hookLevelDisplay">Lvl 1</span>
            </div>
            <p class="upgrade-desc">Catch more fish per cast</p>
            <button onclick="buyUpgrade('hookCount')" id="hookBtn" class="upgrade-btn">
              Cost: <span id="hookCost">75</span> 💰
            </button>
          </div>
          
          <div class="upgrade-item">
            <div class="upgrade-header">
              <span>💵 Passive Income</span>
              <span id="incomeLevelDisplay">Lvl 1</span>
            </div>
            <p class="upgrade-desc">Earn coins while you're away</p>
            <button onclick="buyUpgrade('income')" id="incomeBtn" class="upgrade-btn">
              Cost: <span id="incomeCost">200</span> 💰
            </button>
          </div>
          
          <div class="upgrade-item">
            <div class="upgrade-header">
              <span>🎣 Catch Rate</span>
              <span id="rateLevelDisplay">Lvl 1</span>
            </div>
            <p class="upgrade-desc">Better chance to catch fish</p>
            <button onclick="buyUpgrade('catchRate')" id="rateBtn" class="upgrade-btn">
              Cost: <span id="rateCost">150</span> 💰
            </button>
          </div>
        </div>
        
        <div class="fish-collection">
          <h3>🐟 FISH COLLECTION</h3>
          <div id="collectionList" class="collection-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
// Game State
const gameState = {
  coins: 0,
  totalFishCaught: 0,
  upgrades: {
    lineLength: 1,
    hookCount: 1,
    incomePerSecond: 0,
    catchRate: 0.7
  },
  fishCaught: [],
  fishCaughtThisCast: [],
  isCasting: false,
  castProgress: 0,
  collection: {}
};

// Fish database
const fishDatabase = {
  shallow: [
    { name: 'Minnow', value: 10, rarity: 'common', emoji: '🐠' },
    { name: 'Goldfish', value: 25, rarity: 'uncommon', emoji: '🐟' },
    { name: 'Guppy', value: 15, rarity: 'common', emoji: '🐠' }
  ],
  medium: [
    { name: 'Bass', value: 50, rarity: 'uncommon', emoji: '🐟' },
    { name: 'Trout', value: 75, rarity: 'rare', emoji: '🐟' },
    { name: 'Perch', value: 40, rarity: 'uncommon', emoji: '🐠' }
  ],
  deep: [
    { name: 'Salmon', value: 150, rarity: 'rare', emoji: '🐟' },
    { name: 'Catfish', value: 200, rarity: 'rare', emoji: '🐟' },
    { name: 'Pike', value: 120, rarity: 'rare', emoji: '🐟' },
    { name: 'Legendary Catfish', value: 500, rarity: 'legendary', emoji: '🏆' }
  ],
  veryDeep: [
    { name: 'Anglerfish', value: 300, rarity: 'epic', emoji: '👹' },
    { name: 'Sea Dragon', value: 400, rarity: 'epic', emoji: '🐉' },
    { name: 'Kraken Squid', value: 800, rarity: 'legendary', emoji: '🦑' }
  ]
};

// Canvas setup
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// UI Elements
const coinCountElement = document.getElementById('coinCount');
const incomeCountElement = document.getElementById('incomeCount');
const fishCaughtCountElement = document.getElementById('fishCaughtCount');
const castBtn = document.getElementById('castBtn');
const caughtText = document.getElementById('caughtText');
const collectionList = document.getElementById('collectionList');

// Animation variables
let hookX = canvas.width / 2;
let hookY = 0;
let lineY = 0;
let castDirection = 1;
let hookSpeed = 3;

// Save/Load game
function saveGame() {
  localStorage.setItem('fishingGameState', JSON.stringify(gameState));
}

function loadGame() {
  const saved = localStorage.getItem('fishingGameState');
  if (saved) {
    const loaded = JSON.parse(saved);
    Object.assign(gameState, loaded);
  }
}

// Get available fish based on line depth
function getAvailableFish(depth) {
  if (depth <= 2) return fishDatabase.shallow;
  if (depth <= 5) return fishDatabase.medium;
  if (depth <= 8) return fishDatabase.deep;
  return fishDatabase.veryDeep;
}

// Catch fish logic
function catchFish() {
  const depth = gameState.upgrades.lineLength;
  const hooks = gameState.upgrades.hookCount;
  const catchRate = gameState.upgrades.catchRate;
  
  gameState.fishCaughtThisCast = [];
  let totalValue = 0;
  
  const availableFish = getAvailableFish(depth);
  
  for (let i = 0; i < hooks; i++) {
    if (Math.random() < catchRate) {
      const fish = availableFish[Math.floor(Math.random() * availableFish.length)];
      gameState.fishCaughtThisCast.push(fish);
      gameState.totalFishCaught++;
      totalValue += fish.value;
      
      // Add to collection
      if (!gameState.collection[fish.name]) {
        gameState.collection[fish.name] = {
          ...fish,
          count: 0
        };
      }
      gameState.collection[fish.name].count++;
    }
  }
  
  gameState.coins += totalValue;
  return totalValue;
}

// Draw fishing line and hook
function drawFishingLine() {
  // Draw line
  ctx.strokeStyle = '#8B4513';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(hookX, lineY);
  ctx.stroke();
  
  // Draw hook area (net)
  ctx.fillStyle = 'rgba(200, 200, 200, 0.6)';
  ctx.strokeStyle = '#999';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(hookX, lineY, 30, 40, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  
  // Draw hook itself
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(hookX, lineY, 8, 0, Math.PI * 2);
  ctx.fill();
}

// Draw fish in water
function drawFish() {
  // Draw some static fish
  ctx.font = '30px Arial';
  ctx.globalAlpha = 0.6;
  
  // Random fish scattered in water
  for (let i = 0; i < 5; i++) {
    const y = 150 + i * 80;
    const x = 100 + Math.sin(Date.now() / 1000 + i) * 50;
    ctx.fillText('🐟', x, y);
  }
  
  ctx.globalAlpha = 1;
}

// Draw caught fish display
function drawCaughtFishDisplay() {
  if (gameState.fishCaughtThisCast.length > 0) {
    ctx.font = '20px Arial';
    ctx.fillStyle = '#333';
    ctx.textAlign = 'center';
    
    let displayText = '';
    gameState.fishCaughtThisCast.forEach((fish, index) => {
      displayText += fish.name + ' (' + fish.value + 'g)';
      if (index < gameState.fishCaughtThisCast.length - 1) displayText += ', ';
    });
    
    caughtText.textContent = '🎣 ' + displayText;
    
    setTimeout(() => {
      caughtText.textContent = '';
      gameState.fishCaughtThisCast = [];
    }, 3000);
  }
}

// Animation loop
function animate() {
  // Clear canvas with water gradient
  const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  gradient.addColorStop(0, '#87CEEB');
  gradient.addColorStop(0.5, '#E0F6FF');
  gradient.addColorStop(1, '#0047AB');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Draw decorative water elements
  ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(Math.sin(Date.now() / 2000 + i) * 100 + 250, 50 + i * 30, 30, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Draw fish
  drawFish();
  
  // Update casting animation
  if (gameState.isCasting) {
    gameState.castProgress += 0.02;
    
    if (gameState.castProgress <= 0.5) {
      // Going down
      lineY = canvas.height * (gameState.castProgress * 2);
      hookX = canvas.width / 2 + Math.sin(gameState.castProgress * Math.PI * 2) * 30;
    } else if (gameState.castProgress <= 1) {
      // Coming back up
      lineY = canvas.height * (2 - gameState.castProgress * 2);
      hookX = canvas.width / 2 + Math.sin(gameState.castProgress * Math.PI * 2) * 30;
    } else {
      // Cast complete
      gameState.isCasting = false;
      gameState.castProgress = 0;
      castBtn.disabled = false;
      castBtn.textContent = 'CAST LINE';
      lineY = 0;
      hookX = canvas.width / 2;
      
      // Catch the fish
      catchFish();
      drawCaughtFishDisplay();
      updateUI();
    }
  }
  
  // Draw fishing line and hook
  drawFishingLine();
  
  requestAnimationFrame(animate);
}

// Handle casting
function handleCast() {
  if (!gameState.isCasting) {
    gameState.isCasting = true;
    gameState.castProgress = 0;
    castBtn.disabled = true;
    castBtn.textContent = 'CASTING...';
  }
}

// Buy upgrade
function buyUpgrade(upgradeType) {
  const costs = {
    lineLength: 100 * gameState.upgrades.lineLength,
    hookCount: 75 * gameState.upgrades.hookCount,
    income: 200 * (gameState.upgrades.incomePerSecond + 1),
    catchRate: 150 * (Math.round((gameState.upgrades.catchRate - 0.7) / 0.05) + 1)
  };
  
  if (gameState.coins >= costs[upgradeType]) {
    gameState.coins -= costs[upgradeType];
    
    if (upgradeType === 'lineLength') {
      gameState.upgrades.lineLength++;
    } else if (upgradeType === 'hookCount') {
      gameState.upgrades.hookCount++;
    } else if (upgradeType === 'income') {
      gameState.upgrades.incomePerSecond++;
    } else if (upgradeType === 'catchRate') {
      gameState.upgrades.catchRate = Math.min(gameState.upgrades.catchRate + 0.05, 0.95);
    }
    
    saveGame();
    updateUI();
  }
}

// Update UI
function updateUI() {
  coinCountElement.textContent = gameState.coins.toLocaleString();
  incomeCountElement.textContent = gameState.upgrades.incomePerSecond.toLocaleString();
  fishCaughtCountElement.textContent = gameState.totalFishCaught.toLocaleString();
  
  // Update upgrade buttons and costs
  const lineCost = 100 * gameState.upgrades.lineLength;
  const hookCost = 75 * gameState.upgrades.hookCount;
  const incomeCost = 200 * (gameState.upgrades.incomePerSecond + 1);
  const rateCost = 150 * (Math.round((gameState.upgrades.catchRate - 0.7) / 0.05) + 1);
  
  document.getElementById('lineCost').textContent = lineCost;
  document.getElementById('hookCost').textContent = hookCost;
  document.getElementById('incomeCost').textContent = incomeCost;
  document.getElementById('rateCost').textContent = rateCost;
  
  document.getElementById('lineLevelDisplay').textContent = 'Lvl ' + gameState.upgrades.lineLength;
  document.getElementById('hookLevelDisplay').textContent = 'Lvl ' + gameState.upgrades.hookCount;
  document.getElementById('incomeLevelDisplay').textContent = 'Lvl ' + (gameState.upgrades.incomePerSecond + 1);
  document.getElementById('rateLevelDisplay').textContent = 'Lvl ' + (Math.round((gameState.upgrades.catchRate - 0.7) / 0.05) + 1);
  
  // Disable buttons if not enough coins
  document.getElementById('lineBtn').disabled = gameState.coins < lineCost;
  document.getElementById('hookBtn').disabled = gameState.coins < hookCost;
  document.getElementById('incomeBtn').disabled = gameState.coins < incomeCost;
  document.getElementById('rateBtn').disabled = gameState.coins < rateCost;
  
  // Update collection
  updateCollection();
}

// Update fish collection display
function updateCollection() {
  collectionList.innerHTML = '';
  
  const sortedFish = Object.values(gameState.collection).sort((a, b) => b.count - a.count);
  
  sortedFish.forEach(fish => {
    const item = document.createElement('div');
    item.className = 'fish-item';
    
    const rarityClass = `rarity-${fish.rarity}`;
    item.innerHTML = `
      <span>
        <span class="fish-name">${fish.emoji} ${fish.name}</span>
        <span class="fish-rarity ${rarityClass}">${fish.rarity}</span>
      </span>
      <span class="fish-value">×${fish.count}</span>
    `;
    
    collectionList.appendChild(item);
  });
  
  if (sortedFish.length === 0) {
    collectionList.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">Cast your line to catch fish!</div>';
  }
}

// Passive income
setInterval(() => {
  if (gameState.upgrades.incomePerSecond > 0) {
    gameState.coins += gameState.upgrades.incomePerSecond;
    updateUI();
    saveGame();
  }
}, 1000);

// Save game periodically
setInterval(() => {
  saveGame();
}, 5000);

// Button click handler
castBtn.addEventListener('click', handleCast);

// Start game
loadGame();
updateUI();
animate();

// Initial message
if (gameState.totalFishCaught === 0) {
  caughtText.textContent = 'Click CAST LINE to start fishing! 🎣';
  setTimeout(() => {
    caughtText.textContent = '';
  }, 3000);
}
  </script>
</body>
</html>
